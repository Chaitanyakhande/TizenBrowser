<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TizenBrowser</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #071018;
      color: #f7fbff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 18px;
      background: #101923;
      border-bottom: 1px solid #263747;
    }
    .brand {
      font-size: 28px;
      font-weight: 700;
      margin-right: 10px;
    }
    .brand span { color: #00a8e1; }
    button, input {
      height: 54px;
      border: 2px solid #34475d;
      border-radius: 6px;
      background: #152231;
      color: #fff;
      font-size: 22px;
      outline: none;
    }
    button {
      min-width: 92px;
      padding: 0 18px;
    }
    input {
      width: 100%;
      padding: 0 18px;
    }
    main {
      padding: 52px;
      background:
        linear-gradient(110deg, rgba(7, 16, 24, .95), rgba(7, 16, 24, .74)),
        linear-gradient(135deg, #071018, #172a3c 58%, #202018);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 58px;
      letter-spacing: 0;
    }
    p {
      max-width: 760px;
      margin: 0 0 34px;
      color: #b9c6d3;
      font-size: 26px;
      line-height: 1.35;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 16px;
      max-width: 980px;
    }
    .tile {
      min-height: 130px;
      text-align: left;
      padding: 18px;
      background: linear-gradient(135deg, #173b57, #111820);
      font-size: 24px;
      font-weight: 700;
    }
    .focus {
      border-color: #00a8e1 !important;
      box-shadow: 0 0 0 5px rgba(0, 168, 225, .35);
    }
    .note {
      margin-top: 34px;
      font-size: 21px;
      color: #9fb0c2;
    }
    #remote-cursor {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2147483647;
      width: 28px;
      height: 28px;
      pointer-events: none;
      transform: translate(-4px, -4px);
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, .75));
    }
    #remote-cursor::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      border-left: 0 solid transparent;
      border-right: 19px solid transparent;
      border-bottom: 28px solid #fff;
      transform: rotate(-38deg);
      transform-origin: 4px 4px;
    }
    #remote-cursor::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 6px;
      width: 0;
      height: 0;
      border-left: 0 solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 18px solid #00a8e1;
      transform: rotate(-38deg);
      transform-origin: 4px 4px;
    }
    #remote-cursor.clicking {
      transform: translate(-4px, -4px) scale(.82);
    }
  </style>
</head>
<body>
  <div id="remote-cursor" aria-hidden="true"></div>
  <header>
    <div class="brand">Tizen<span>Browser</span></div>
    <button data-action="home">Home</button>
    <input id="address" value="https://www.google.com/" aria-label="Address">
    <button data-action="go">Go</button>
  </header>
  <main>
    <h1>Browse From Your TV</h1>
    <p>Remote-friendly start page with quick search and shortcuts. The built-in shield script is included for TizenBrew site injection where supported.</p>
    <div class="grid">
      <button class="tile" data-url="https://www.google.com/">Google</button>
      <button class="tile" data-url="https://www.youtube.com/tv">YouTube TV</button>
      <button class="tile" data-url="https://www.primevideo.com/">Prime Video</button>
      <button class="tile" data-url="https://www.github.com/">GitHub</button>
    </div>
    <div class="note">Use arrows to move the pointer, OK to click, and Back to return.</div>
  </main>
  <script>
    (function () {
      'use strict';

      var focus = 0;
      var items = Array.prototype.slice.call(document.querySelectorAll('button,input'));
      var address = document.getElementById('address');
      var cursor = document.getElementById('remote-cursor');
      var cursorX = Math.round(window.innerWidth / 2);
      var cursorY = Math.round(window.innerHeight / 2);
      var cursorStep = 34;

      function normalize(value) {
        var text = String(value || '').trim();
        if (!text) return 'https://www.google.com/';
        if (/^[a-z]+:\/\//i.test(text)) return text;
        if (text.indexOf('.') !== -1 && text.indexOf(' ') === -1) return 'https://' + text;
        return 'https://www.google.com/search?q=' + encodeURIComponent(text);
      }

      function setFocus(index) {
        var i;
        focus = Math.max(0, Math.min(items.length - 1, index));
        for (i = 0; i < items.length; i += 1) items[i].classList.remove('focus');
        items[focus].classList.add('focus');
        items[focus].focus();
      }

      function openUrl(url) {
        location.href = normalize(url);
      }

      function updateCursor() {
        cursorX = Math.max(0, Math.min(window.innerWidth - 4, cursorX));
        cursorY = Math.max(0, Math.min(window.innerHeight - 4, cursorY));
        cursor.style.left = cursorX + 'px';
        cursor.style.top = cursorY + 'px';
      }

      function elementAtCursor() {
        var hidden = cursor.style.display;
        var element;

        cursor.style.display = 'none';
        element = document.elementFromPoint(cursorX, cursorY);
        cursor.style.display = hidden;

        while (element && element !== document.body && items.indexOf(element) === -1) {
          element = element.parentNode;
        }

        return element && items.indexOf(element) !== -1 ? element : null;
      }

      function pulseCursor() {
        cursor.classList.add('clicking');
        window.setTimeout(function () {
          cursor.classList.remove('clicking');
        }, 120);
      }

      function clickAtCursor() {
        var item = elementAtCursor();

        pulseCursor();

        if (item) {
          setFocus(items.indexOf(item));
          run(item);
        }
      }

      function run(item) {
        var action = item.getAttribute('data-action');
        if (item.getAttribute('data-url')) openUrl(item.getAttribute('data-url'));
        else if (action === 'home') openUrl('https://www.google.com/');
        else if (action === 'go' || item === address) openUrl(address.value);
      }

      document.addEventListener('keydown', function (event) {
        if (event.keyCode === 37) cursorX -= cursorStep;
        else if (event.keyCode === 38) cursorY -= cursorStep;
        else if (event.keyCode === 39) cursorX += cursorStep;
        else if (event.keyCode === 40) cursorY += cursorStep;
        else if (event.keyCode === 13) clickAtCursor();
        else if (event.keyCode === 10009) history.back();
        else return;

        updateCursor();
        event.preventDefault();
      });

      document.addEventListener('click', function (event) {
        if (items.indexOf(event.target) !== -1) run(event.target);
      });

      setFocus(2);
      updateCursor();

      window.addEventListener('resize', updateCursor);
    }());
  </script>
</body>
</html>
